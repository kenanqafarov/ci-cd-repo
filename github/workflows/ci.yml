name: Actions App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual işə salmaq üçün (Task 6)

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Kodu GitHub-dan götürür
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 mühitini qurur
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Maven asılılıqlarını keşləyir (Sürət üçün)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # 4. Proyektin yığılması və testlərin işləməsi
      - name: Build and test with Maven
        run: mvn clean verify